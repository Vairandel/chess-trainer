<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess Trainer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♟</text></svg>" />
  </head>
  <body>
    <header class="top">
      <h1>♟ Chess Trainer</h1>
    </header>

    <main class="layout">
      <section class="board-col">
        <div class="player player-top" id="player-top"></div>
        <div class="board-row">
          <div class="eval-bar" id="eval-bar" title="Engine evaluation">
            <div class="eval-fill" id="eval-fill"></div>
            <span class="eval-text" id="eval-text"></span>
          </div>
          <div class="board-wrap"><div id="board"></div></div>
        </div>
        <div class="player player-bottom" id="player-bottom"></div>
        <div id="graph" hidden></div>
      </section>

      <aside class="panel">
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <div class="game-info" id="game-info"></div>

        <div class="engine-row">
          <button id="analyze" class="primary">Analyze game</button>
          <select id="depth" aria-label="Analysis strength">
            <option value="12">Fast</option>
            <option value="16" selected>Normal</option>
            <option value="20">Deep</option>
          </select>
        </div>
        <div class="progress" id="progress" hidden>
          <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
          <span id="progress-text"></span>
        </div>
        <div class="engine-status" id="engine-status">Loading Stockfish…</div>
        <div class="summary" id="summary" hidden></div>

        <ol class="moves" id="moves" aria-label="Moves"></ol>

        <section class="lesson" id="lesson" aria-live="polite"></section>
        <label class="toggle"><input type="checkbox" id="show-best" /> Show the engine's best move</label>

        <nav class="nav" aria-label="Move navigation">
          <button id="nav-start" title="Start (Home)" aria-label="Go to start">⏮</button>
          <button id="nav-prev" title="Previous move (←)" aria-label="Previous move">◀</button>
          <button id="nav-next" title="Next move (→)" aria-label="Next move">▶</button>
          <button id="nav-end" title="End (End)" aria-label="Go to end">⏭</button>
          <button id="flip" title="Flip board (F)" aria-label="Flip board">⇅</button>
        </nav>

        <div class="actions">
          <button id="new-game">New game</button>
          <button id="import" class="primary">Import PGN</button>
          <button id="copy-pgn">Copy PGN</button>
        </div>
        <p class="hint">Keys: ← → to step, Home / End, F to flip, A to analyze.</p>
      </aside>
    </main>

    <dialog id="import-dialog" aria-labelledby="import-title">
      <form method="dialog" id="import-form">
        <h2 id="import-title">Import a game</h2>
        <label for="pgn-text">Paste PGN</label>
        <textarea id="pgn-text" rows="10" spellcheck="false"
          placeholder='[White "You"]&#10;[Black "Opponent"]&#10;&#10;1. e4 e5 2. Nf3 Nc6 ...'></textarea>
        <div class="file-row">
          <label class="file-btn">
            Choose a .pgn file
            <input type="file" id="pgn-file" accept=".pgn,.txt,application/x-chess-pgn,text/plain" />
          </label>
          <span class="muted">or drop it on the text box</span>
        </div>
        <div class="game-pick" id="game-pick" hidden>
          <label for="game-select">This file has several games. Pick one:</label>
          <select id="game-select"></select>
        </div>
        <p class="error" id="import-error" role="alert"></p>
        <div class="dialog-actions">
          <button value="cancel" formnovalidate>Cancel</button>
          <button id="import-load" class="primary" value="load">Load game</button>
        </div>
      </form>
    </dialog>

    <dialog id="promo-dialog" class="promo-dialog" aria-label="Choose promotion piece">
      <div class="cg-wrap promo" id="promo-choices"></div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
